<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#27272a" stroke-width="2" />
  
  <!-- Subtle accent corner glow -->
  <circle cx="110" cy="18" r="14" fill="#0284c7" opacity="0.3" filter="blur(8px)" />

  <!-- Logo Text: lox.bd -->
  <g filter="url(#shadow)">
    <text 
      x="64" 
      y="76" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
      font-size="36" 
      font-weight="900" 
      letter-spacing="-1.5" 
      text-anchor="middle" 
      fill="#ffffff"
    >
      lox<tspan fill="#38bdf8">.bd</tspan>
    </text>
  </g>

  <!-- Underline accent bar -->
  <rect x="28" y="88" width="72" height="4" rx="2" fill="#38bdf8" />
</svg>
